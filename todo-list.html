
<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            color: #333;
        }

        input {
            padding: 8px;
            width: 220px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        li {
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <h2>To-Do List</h2>

    <input type="text" id="inputTugas" placeholder="Tulis tugas...">

    <button onclick="tambahTugas()">Tambah</button>

    <ul id="daftarTugas">
    </ul>

    <script>
        function tambahTugas() {

            // Mengambil isi input
            let input = document.getElementById("inputTugas");

            let tugas = input.value.trim();

            // Memeriksa apakah input kosong
            if (tugas === "") {
                alert("Silakan tulis tugas terlebih dahulu!");
                return;
            }

            // Membuat elemen list baru
            let item = document.createElement("li");

            // Mengisi elemen dengan tugas
            item.textContent = tugas;

            // Menambahkan tugas ke daftar
            document.getElementById("daftarTugas").appendChild(item);

            // Mengosongkan input
            input.value = "";
        }
    </script>

</body>
</html>
